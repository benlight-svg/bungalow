<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House plan 3D</title>
<style>
:root{box-sizing:border-box;--bg:#f5f5f7;--ground:#e6e6eb;--ink:#1d1d1f;--sub:#6e6e73;--glass:rgba(255,255,255,.72);--hair:rgba(0,0,0,.08);--fill:rgba(120,120,128,.16);--thumb:#fff;--accent:#007aff;--tint:rgba(0,122,255,.14);--shadow:0 8px 32px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--ground:#1c1c1e;--ink:#f5f5f7;--sub:#98989d;--glass:rgba(44,44,46,.7);--hair:rgba(255,255,255,.1);--fill:rgba(120,120,128,.32);--thumb:#636366;--accent:#0a84ff;--tint:rgba(10,132,255,.24);--shadow:0 8px 32px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0b0b0d;--ground:#1c1c1e;--ink:#f5f5f7;--sub:#98989d;--glass:rgba(44,44,46,.7);--hair:rgba(255,255,255,.1);--fill:rgba(120,120,128,.32);--thumb:#636366;--accent:#0a84ff;--tint:rgba(10,132,255,.24);--shadow:0 8px 32px rgba(0,0,0,.5)}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.01em;overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;padding:0;cursor:pointer}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border:.5px solid var(--hair);box-shadow:var(--shadow)}
#top{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
#top .row{display:flex;gap:8px;align-items:center;pointer-events:auto;max-width:100%}
#plan-note{font-size:12px;color:var(--sub);text-align:center;max-width:min(92vw,420px);padding:4px 12px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px;border-radius:12px}
.seg.plan{border-radius:14px;padding:3px}
.seg .thumb{position:absolute;left:2px;top:2px;bottom:2px;border-radius:10px;background:var(--thumb);box-shadow:0 1px 4px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.04);transition:transform .32s cubic-bezier(.3,.8,.3,1),opacity .2s;pointer-events:none}
.seg.plan .thumb{left:3px;top:3px;bottom:3px;border-radius:11px}
.seg button{position:relative;z-index:1;padding:7px 14px;font-weight:500;font-size:13.5px;white-space:nowrap;border-radius:10px;color:var(--ink);opacity:.72;transition:opacity .2s}
.seg button.on{opacity:1;font-weight:600}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--accent)}
.round:active,.tile:active{transform:scale(.94)}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:24px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
#dock .seg{background:var(--fill);flex:none}
#dock .seg button{padding:8px 12px}
.sep{width:.5px;align-self:stretch;margin:6px 2px;background:var(--hair);flex:none}
.tile{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:7px 0 6px;border-radius:14px;font-size:10.5px;font-weight:500;color:var(--sub);transition:background .2s,color .2s,transform .15s}
.tile svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile.on{background:var(--tint);color:var(--accent)}
#hint{position:fixed;left:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--sub);max-width:210px;line-height:1.35;pointer-events:none}
@media (max-width:900px){#hint{display:none}}
.mob{display:none}
#b-menu{display:none;align-items:center;gap:8px;height:36px;padding:0 14px 0 11px;border-radius:18px;font-weight:600;font-size:14px;color:var(--ink)}
#b-menu svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
#b-menu svg line{transform-origin:12px 12px;transition:transform .28s cubic-bezier(.3,.8,.3,1),opacity .2s}
#b-menu.open svg .l1{transform:translateY(6px) rotate(45deg)}
#b-menu.open svg .l2{opacity:0}
#b-menu.open svg .l3{transform:translateY(-6px) rotate(-45deg)}
#menu{position:fixed;z-index:20;left:12px;top:calc(56px + env(safe-area-inset-top,0px));width:min(calc(100vw - 24px),340px);max-height:calc(100dvh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;padding:6px;border-radius:20px;opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top left;pointer-events:none;transition:opacity .2s,transform .28s cubic-bezier(.3,.8,.3,1);scrollbar-width:none}
#menu::-webkit-scrollbar{display:none}
#menu.open{opacity:1;transform:none;pointer-events:auto}
#menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:14px;position:relative}
#menu button b{display:block;font-size:14px;font-weight:600}
#menu button span{display:block;font-size:11.5px;color:var(--sub);line-height:1.3;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#menu button.on{background:var(--tint)}
#menu button.on b{color:var(--accent)}
#menu button:active{transform:scale(.98)}
@media (max-width:700px){
 #seg-plan{display:none}
 #b-menu{display:flex}
 #plan-note{font-size:11.5px;line-height:1.3;border-radius:14px;padding:5px 12px;max-width:min(88vw,340px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 #dock{left:10px;right:10px;transform:none;max-width:none;justify-content:space-between;gap:2px;padding:6px;border-radius:22px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
 #dock .seg button{padding:8px 10px;font-size:13px}
 .tile{flex:1;min-width:0;width:auto;font-size:10px;padding:6px 0 5px}
 .tile svg{width:21px;height:21px}
 .sep{margin:6px 1px}
}
@media (max-width:360px){#dock .seg button{padding:8px 7px;font-size:12px}.tile{font-size:9.5px}}
@media (min-width:701px){#menu{display:none}}
</style></head><body>

 <div class="row">
  <button id="b-menu" class="glass" aria-label="Choose plan" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24"><line class="l1" x1="4" y1="6" x2="20" y2="6"/><line class="l2" x1="4" y1="12" x2="20" y2="12"/><line class="l3" x1="4" y1="18" x2="20" y2="18"/></svg><span id="cur-name">Original</span></button>

</div>

  // skylights set into the main roof: side 'N' = north-facing slope, 'S' = south-facing slope (cx, cz in metres)
  const skylight=(cx,cz,w,l,side)=>{
    const t=Math.tan(Math.PI/6),Z0m=u.cz-(u.cz-5.78),n0=side==='N'?[0,1,-t]:[0,1,t],k=Math.hypot(...n0),n=n0.map(v=>v/k);
    const hAt=z=>side==='N'?WALL+t*(z-5.78):u.h-t*(z-u.cz);
    const quad=(hw,hl,off)=>[[cx-hw,cz-hl],[cx+hw,cz-hl],[cx+hw,cz+hl],[cx-hw,cz+hl]].map(([x,z])=>[x+n[0]*off,hAt(z)+n[1]*off,z+n[2]*off]);
    const tris=q=>[...q[0],...q[1],...q[2],...q[0],...q[2],...q[3]];
    roofG.add(roofMesh(tris(quad(w/2+.08,l/2+.08,.03)),RM.frame));
    roofG.add(roofMesh(tris(quad(w/2,l/2,.055)),RM.glass));
  };
  skylight(7.6,7.6,1.2,1.4,'N');                 // above the kitchen (all plans)
  if(id==='E')skylight(10.0,10.4,1.4,1.4,'S');   // above the new dining room
  if(id==='O')roofG.add(hipRoof(576,-1660,951,-1262,30,RM.slate)),roofG.add(hipRoof(925,-1370,1120,-1255,25,RM.slate));
  else roofG.add(hipRoof(576,-1660,1113,-1262,30,RM.slate));
  roofG.add(hipRoof(348,-538,734,-154,30,RM.tile));
  roofG.add(gableRoof(348,-1020,595,-520,28,RM.tile));
  roofG.add(gableRoof(255,-1835,504,-1346,25,RM.shed));
  if(id!=='O'&&id!=='A'){
    roofG.add(shedRoof(244,-1356,590,-999,.45,'E',RM.shed));
    roofG.add(shedRoof(933,-607,1254,-461,.17,'S',RM.slate));
  }
}

// ---- furniture (simple blocks, toggled with the Furniture button; sizes are typical, not measured)
const furnG=new THREE.Group(); scene.add(furnG);
const FMc={}; const fmat=c=>FMc[c]||(FMc[c]=new THREE.MeshStandardMaterial({color:c,roughness:.85}));
const CL={wood:0x9b7b5b,wood2:0x7d5f45,dark:0x30343b,fabric:0x6f8097,fabric2:0xb48a6e,white:0xf0efea,linen:0xdde5ee,unit:0xd9d4c8,top:0x4a4f55,metal:0xb9bec5,wardrobe:0xcdc6b8,pot:0xb5654a,screen:0x15181d};
function fb(x0,y0,x1,y1,z0,z1,c){furnG.add(box([Math.min(x0,x1),Math.min(y0,y1),Math.max(x0,x1),Math.max(y0,y1)],z0,z1,fmat(c)))}
function bed(x0,y0,x1,y1,head,dbl){ // head: which side the headboard is on (E/W = x1/x0 side, N/S = y1/y0 side)
  fb(x0,y0,x1,y1,0,.28,CL.wood); fb(x0+3,y0+3,x1-3,y1-3,.28,.52,CL.linen);
  const t=9,hb={E:[x1-t,y0,x1,y1],W:[x0,y0,x0+t,y1],N:[x0,y1-t,x1,y1],S:[x0,y0,x1,y0+t]}[head]; fb(...hb,0,1.05,CL.wood);
  const ew=head==='E'||head==='W',lo=ew?y0:x0,hi=ew?y1:x1,mid=(lo+hi)/2,P=dbl?[[lo+10,mid-4],[mid+4,hi-10]]:[[lo+12,hi-12]];
  const dep=head==='E'?[x1-t-42,x1-t-4]:head==='W'?[x0+t+4,x0+t+42]:head==='N'?[y1-t-42,y1-t-4]:[y0+t+4,y0+t+42];
  P.forEach(p=>ew?fb(dep[0],p[0],dep[1],p[1],.52,.62,CL.white):fb(p[0],dep[0],p[1],dep[1],.52,.62,CL.white));
}
function chair(x,y,side){ // seat 42x42 with back on the given side (N or S)
  fb(x-21,y-21,x+21,y+21,0,.45,CL.wood2);
  if(side==='N')fb(x-21,y+17,x+21,y+21,.45,.9,CL.wood2);else fb(x-21,y-21,x+21,y-17,.45,.9,CL.wood2)}
function buildFurn(id){
  disposeGroup(furnG);
  // bedrooms
  bed(1500,-1165,1708,-1005,'E',true); fb(1668,-1205,1708,-1170,0,.5,CL.wood); fb(1668,-1000,1708,-965,0,.5,CL.wood); fb(1390,-1130,1440,-1030,0,.85,CL.wood);
  if(id==='D'){ // merged bedroom 2
    bed(1140,-1228,1300,-1028,'S',true); fb(1100,-1228,1138,-1190,0,.5,CL.wood); fb(1302,-1228,1340,-1190,0,.5,CL.wood);
    fb(1332,-1130,1374,-1000,0,2.0,CL.wardrobe); fb(945,-1060,985,-1160,0,.85,CL.wood); fb(1010,-1160,1070,-1215,0,.8,CL.fabric2);
  } else if(id!=='E'){bed(1110,-1165,1310,-1065,'W',false); fb(1332,-1130,1374,-1000,0,2.0,CL.wardrobe); fb(1160,-1232,1290,-1192,0,.75,CL.wood);}
  bed(480,-182,632,-382,'N',true); fb(440,-182,478,-222,0,.5,CL.wood); fb(634,-182,672,-222,0,.5,CL.wood); fb(372,-200,420,-300,0,.85,CL.wood);
  // utility
  fb(368,-560,428,-860,0,.9,CL.unit); fb(366,-558,430,-862,.9,.94,CL.top); fb(370,-870,430,-925,0,.85,CL.white); fb(370,-930,430,-985,0,.85,CL.white);
  // kitchen, island, dining
  fb(595,-630,895,-690,0,.9,CL.unit); fb(595,-630,897,-694,.9,.94,CL.top); fb(978,-630,1028,-676,0,1.85,CL.metal);
  fb(655,-815,872,-890,0,.9,CL.unit); fb(650,-810,877,-895,.9,.94,CL.top);
  [700,760,820].forEach(x=>fb(x-17,-905,x+17,-939,0,.65,CL.dark));
  if(id==='E'||id==='F'){ // larger dining room
    const ox=id==='F'?-120:0;
    fb(880+ox,-990,1120+ox,-1090,.72,.76,CL.wood); [[890,-1000],[1110,-1000],[890,-1080],[1110,-1080]].forEach(p=>fb(p[0]+ox-3,p[1]-3,p[0]+ox+3,p[1]+3,0,.72,CL.wood));
    [910,970,1030,1090].forEach(x=>{chair(x+ox,-968,'N');chair(x+ox,-1112,'S')});
    if(id==='E'){fb(1338,-990,1374,-1130,0,.85,CL.wood); fb(1338,-1140,1374,-1215,0,1.9,CL.wardrobe)}
    else fb(1054,-990,1090,-1130,0,.85,CL.wood);
  } else {
    fb(690,-990,870,-1080,.72,.76,CL.wood); [[700,-1000],[860,-1000],[700,-1070],[860,-1070]].forEach(p=>fb(p[0]-3,p[1]-3,p[0]+3,p[1]+3,0,.72,CL.wood));
    [715,780,845].forEach(x=>{chair(x,-968,'N');chair(x,-1104,'S')});
  }
  // sitting area in the open-plan room
  fb(1015,-806,1215,-896,0,.45,CL.fabric); fb(1015,-880,1215,-896,.45,.9,CL.fabric); fb(1070,-735,1150,-785,0,.4,CL.wood); fb(960,-730,1020,-790,0,.8,CL.fabric2);
  // living / sitting room
  if(id==='O'){
    fb(600,-1280,690,-1480,0,.45,CL.fabric); fb(600,-1280,622,-1480,.45,.9,CL.fabric); fb(740,-1340,800,-1420,0,.4,CL.wood);
    fb(880,-1250,928,-1350,0,.5,CL.dark); fb(922,-1262,927,-1338,.55,1.15,CL.screen); fb(850,-1470,915,-1535,0,.8,CL.fabric2);
  } else {
    fb(600,-1300,690,-1520,0,.45,CL.fabric); fb(600,-1300,622,-1520,.45,.9,CL.fabric); fb(750,-1380,830,-1440,0,.4,CL.wood); fb(1000,-1480,1070,-1550,0,.8,CL.fabric2);
    if(id==='C'||id==='D'||id==='E'||id==='F'){fb(1050,-1250,1092,-1350,0,.5,CL.dark);fb(1086,-1262,1091,-1338,.55,1.15,CL.screen)}
    else{fb(960,-1365,1090,-1395,0,.5,CL.dark);fb(985,-1366,1065,-1371,.55,1.15,CL.screen)}
  }
  // potting room
  fb(278,-1450,338,-1750,0,.92,CL.wood); fb(300,-1368,470,-1396,0,1.8,CL.wood2);
  [[285,-1470],[295,-1560],[290,-1650],[300,-1720]].forEach(p=>fb(p[0],p[1],p[0]+24,p[1]-24,.92,1.1,CL.pot));
  if(id!=='O'&&id!=='A'){
    if(id==='B'||id==='C'||id==='F'){
    // cinema room: screen on the west wall, recliners facing it
    fb(262,-1150,300,-1240,0,.5,CL.wood); fb(263,-1100,268,-1290,.9,2.0,CL.screen);
    [[-1110,-1160],[-1170,-1220],[-1230,-1280]].forEach(r=>{fb(460,r[0],545,r[1],0,.45,CL.dark);fb(522,r[0],545,r[1],.45,1.0,CL.dark)});
    } else { // bedroom 4 (old cinema room)
      bed(266,-1260,470,-1100,'W',true); fb(266,-1296,310,-1263,0,.5,CL.wood); fb(266,-1097,310,-1064,0,.5,CL.wood);
      fb(270,-1022,420,-1062,0,2.0,CL.wardrobe); fb(330,-1300,420,-1338,0,.85,CL.wood);
    }
    // porch bench
    fb(955,-485,1000,-590,0,.45,CL.wood);
  }
  if(id==='C'){fb(944,-1030,978,-1210,0,1.9,CL.wood);fb(1040,-1160,1090,-1225,0,.5,CL.wood)}
}

function syncSegs(){document.querySelectorAll('.seg').forEach(sg=>{const bs=[...sg.querySelectorAll('button')],i=bs.findIndex(b=>b.classList.contains('on')),th=sg.querySelector('.thumb');
  th.style.width='calc((100% - '+(sg.classList.contains('plan')?6:4)+'px)/'+bs.length+')';th.style.opacity=i<0?0:1;if(i>=0)th.style.transform='translateX('+i*100+'%)'})}
const PLANS=['O','A','B','C','D','E','F'];
const PLAN_NOTE={O:'Original plan (as supplied by the agent, plus the potting room)',A:'Plan A: original layout',B:'Plan B: + entrance porch and cinema room',C:'Plan C: as B, hall becomes coat storage room and the dining/living wall moves south',D:'Plan D: as C, cinema becomes bedroom 4 and coat storage merges with bedroom 2',E:'Plan E: as D, but coat storage and bedroom 2 open up into one large kitchen/dining/sitting room, no chimney',F:'Plan F: as C, but the coat storage joins the dining room and the chimney breast is removed'};
const PLAN_NAME={O:'Original',A:'Plan A',B:'Plan B',C:'Plan C',D:'Plan D',E:'Plan E',F:'Plan F'};
let curPlan='O';
function setPlan(id){curPlan=id;build(id);buildRoof(id);buildFurn(id);
  PLANS.forEach(k=>document.getElementById('p-'+k).classList.toggle('on',k===id));
  document.getElementById('plan-note').textContent=PLAN_NOTE[id];
  document.getElementById('cur-name').textContent=PLAN_NAME[id];
  menuEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  document.getElementById('b-next').title='Next: '+PLAN_NAME[PLANS[(PLANS.indexOf(id)+1)%PLANS.length]];syncSegs()}
PLANS.forEach(k=>document.getElementById('p-'+k).onclick=()=>setPlan(k));
// burger menu (mobile)
const menuEl=document.getElementById('menu'),menuBtn=document.getElementById('b-menu');
PLANS.forEach(k=>{const b=document.createElement('button');b.dataset.id=k;b.setAttribute('role','menuitem');
  const n=document.createElement('b');n.textContent=PLAN_NAME[k];const d=document.createElement('span');d.textContent=PLAN_NOTE[k].replace(/^Plan [A-F]: /,'').replace(/^./,c=>c.toUpperCase());
  b.append(n,d);b.onclick=()=>{setPlan(k);toggleMenu(false)};menuEl.appendChild(b)});
function toggleMenu(open){open=open===undefined?!menuEl.classList.contains('open'):open;menuEl.classList.toggle('open',open);menuBtn.classList.toggle('open',open);menuBtn.setAttribute('aria-expanded',open)}
menuBtn.onclick=e=>{e.stopPropagation();toggleMenu()};
document.addEventListener('pointerdown',e=>{if(!menuEl.contains(e.target)&&!menuBtn.contains(e.target))toggleMenu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')toggleMenu(false)});
document.getElementById('b-next').onclick=()=>setPlan(PLANS[(PLANS.indexOf(curPlan)+1)%PLANS.length]);
setPlan('O');
// ---- framing & orbit
const box3=new THREE.Box3().setFromObject(walls); const target=box3.getCenter(new THREE.Vector3()); target.y=0.8;
const size=box3.getSize(new THREE.Vector3()); const fit=Math.max(size.x,size.z)*1.25;
const fitD=m=>{const a=innerWidth/innerHeight;return fit*m*(a<1.2?Math.min(2.3,1.1/a):1)};
let th=0.55,ph=0.95,dist=fitD(1.15),curView='iso';
function place(){camera.position.set(target.x+dist*Math.sin(ph)*Math.sin(th),target.y+dist*Math.cos(ph),target.z+dist*Math.sin(ph)*Math.cos(th));camera.lookAt(target)}
const ptrs=new Map();let lastPinch=0;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button,s:e.shiftKey})});
canvas.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);lastPinch=0});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(lastPinch)dist=Math.max(4,Math.min(120,dist*lastPinch/d));lastPinch=d;setView('free')}
  else if(p.b===2||p.s){const k=dist*0.0016;const r=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);const u=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    target.addScaledVector(r,-dx*k).addScaledVector(u,dy*k)}
  else{th-=dx*0.006;ph=Math.max(0.02,Math.min(1.5,ph-dy*0.006));setView('free')}place()});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(4,Math.min(120,dist*Math.exp(e.deltaY*0.001)));place()},{passive:false});
function setView(v){curView=v;document.getElementById('b-iso').classList.toggle('on',v==='iso');document.getElementById('b-top').classList.toggle('on',v==='top');syncSegs()}
document.getElementById('b-iso').onclick=()=>{th=0.55;ph=0.95;dist=fitD(1.15);target.set(box3.getCenter(new THREE.Vector3()).x,0.8,box3.getCenter(new THREE.Vector3()).z);setView('iso');place()};
document.getElementById('b-top').onclick=()=>{th=0;ph=0.001;dist=fitD(1.35);target.set(box3.getCenter(new THREE.Vector3()).x,0.8,box3.getCenter(new THREE.Vector3()).z);setView('top');place()};
document.getElementById('b-cut').onclick=e=>{const on=e.currentTarget.classList.toggle('on');walls.scale.y=on?0.45:1};
document.getElementById('b-furn').onclick=e=>{furnG.visible=e.currentTarget.classList.toggle('on')};
document.getElementById('b-roof').onclick=e=>{roofG.visible=e.currentTarget.classList.toggle('on')};
document.getElementById('b-lab').onclick=e=>{labels.visible=e.currentTarget.classList.toggle('on')};
function theme(){const bg=css('--bg');scene.background=new THREE.Color(bg);ground.material.color.set(css('--ground'))}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);theme();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
let lastAspect=innerWidth/innerHeight;
addEventListener('resize',()=>{resize();const a=innerWidth/innerHeight;
  if(Math.abs(a-lastAspect)>.05){lastAspect=a;if(curView==='iso'||curView==='top')document.getElementById(curView==='iso'?'b-iso':'b-top').click()}});
resize();place();
(function loop(){renderer.render(scene,camera);requestAnimationFrame(loop)})();
</script></body></html>
